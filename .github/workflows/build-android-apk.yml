name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Copy web assets into www/
        run: |
          mkdir -p www
          rsync -av --no-recursive \
            --include="*.html" \
            --include="*.json" \
            --include="*.js" \
            --include="*.png" \
            --include="*.jpg" \
            --include="*.jpeg" \
            --include="*.svg" \
            --include="*.ico" \
            --include="*.pdf" \
            --exclude="*" \
            ./ www/
          echo "=== www/ contents ==="
          ls -lah www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync android

      # ── Replace default Capacitor icons with the PUMMA logo ───────────
      - name: Apply custom app icon
        run: |
          pip install Pillow --break-system-packages -q
          python3 << 'PYEOF'
          from PIL import Image
          import os, shutil

          src = "MOCKBOAT LOGO.png"
          if not os.path.exists(src):
              print("⚠ MOCKBOAT LOGO.png not found — skipping icons")
              exit(0)

          img = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          base = "android/app/src/main/res"
          for folder, size in sizes.items():
              d = os.path.join(base, folder)
              os.makedirs(d, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(d, "ic_launcher.png"))
              resized.save(os.path.join(d, "ic_launcher_round.png"))
              print(f"✓ {folder}: {size}x{size}")
          print("✓ All icons applied from MOCKBOAT LOGO.png")
          PYEOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumma-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pumma-dashboard-debug-apk
          path: dist

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
