name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Copy web assets into www/
        run: |
          mkdir -p www
          rsync -av --no-recursive \
            --include="*.html" \
            --include="*.json" \
            --include="*.js" \
            --include="*.png" \
            --include="*.jpg" \
            --include="*.jpeg" \
            --include="*.svg" \
            --include="*.ico" \
            --include="*.pdf" \
            --exclude="*" \
            ./ www/
          echo "=== www/ contents ==="
          ls -lah www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Apply custom app icon
        run: |
          pip install Pillow --break-system-packages -q
          python3 make_icons.py

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/pumma-key.jks
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore /tmp/pumma-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            pumma-key
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-signed.apk
          echo "APK signed and aligned!"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumma-dashboard-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pumma-dashboard-release-apk
          path: dist

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
