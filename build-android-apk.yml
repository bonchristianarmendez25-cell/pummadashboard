name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java FIRST — Gradle/Capacitor need it from the start ──────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Accept Android SDK licenses & install required packages ───────
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "y" | sdkmanager --licenses

      # ── Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Capacitor dependencies
        run: npm install

      # ── Copy ALL web assets into www/ ─────────────────────────────────
      # Use 'find' for PDFs so filenames with spaces are handled safely.
      - name: Copy web assets into www/
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp pumma_patch_apply.js www/ 2>/dev/null || true
          for f in *.png *.jpg *.jpeg *.svg *.ico; do
            [ -e "$f" ] && cp "$f" www/
          done
          # Use find + while-read so PDF names with spaces don't break the loop
          find . -maxdepth 1 -iname "*.pdf" -print0 | while IFS= read -r -d '' f; do
            cp "$f" www/
            echo "Copied PDF: $f"
          done
          echo "=== www/ contents ==="
          ls -lah www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumma-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pumma-dashboard-debug-apk
          path: dist

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
